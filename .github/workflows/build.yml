name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.matrimonial --project-name matrimonial_admin /tmp/gen
          cp -r /tmp/gen/android ./android

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Matrimonial App"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Create launcher icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: matrimonial-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
